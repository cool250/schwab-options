# Application-level choices — one setting per line, `key=value`; `#` starts a
# comment. Read once at startup by utils/app_config.py, which lists every
# allowed key with its type and default and rejects unknown keys or bad
# values (a typo fails the app's start, it's never silently ignored).
# Restart the backend after editing. Set APP_PROPERTIES to use another file.

# Merge legs that form a ratio spread (buy 1 / sell 2+ at another strike,
# same expiration, opened together) into one row: Positions' futures-option
# tables, the copilot's trade history, and the default of the Transactions
# page's "Ignore Grouping" checkbox (still changeable per search there).
trades.group_ratio_spreads=false

# Which rows the Transactions page shows when opened: realized (closed),
# unrealized (still open), or both. Options tab: the Realized / Unrealized
# boxes. Equity & futures tab: "realized" ticks Realized Gains Only; "both"
# or "unrealized" leaves it unticked, showing closed and open lots.
transactions.default_view=both

# How far back Positions reconstructs open futures / futures-option
# positions from transaction history (Schwab's positions endpoint doesn't
# return them). Longer catches older open positions but is slower.
positions.open_lookback_days=30

# Extra history fetched around a requested date range (Transactions,
# Reports, the copilot), so a trade whose open falls before the range — or
# whose close is recorded just after it — still gets matched. Options look
# back option_lookback_days and forward option_lookforward_days; equities
# and outright futures, which sit open longer, look back
# equity_lookback_days. Longer catches older opens but is slower. A request
# is capped at a year (Schwab's limit): on a long range the option padding
# shrinks to fit, while the equity lookback is fetched a year at a time
# (one extra request per year of lookback).
transactions.option_lookback_days=30
transactions.option_lookforward_days=5
transactions.equity_lookback_days=365

# Default date range, in days back from today, for the copilot's trade
# history tools when the question doesn't name one.
copilot.history_days=90

# Options-wheel rules (the copilot's get_wheel_snapshot, copilot/wheel.py).
# Leverage = total notional (stock, futures at price x point value, short
# puts at strike x multiplier) / net liquidity, in percent: below
# aggressive_max the wheel adds premium freely, from defensive_min up it
# only reduces risk, in between it's neutral.
wheel.aggressive_max_leverage_pct=150
wheel.defensive_min_leverage_pct=300
# Closing or rolling a position at a loss is recommended only within this
# percent of the year's realized P&L (none when the year is a loss).
wheel.loss_budget_pct=25
# Wind-down call ratios (1x2 up to 1x3) against long futures: the short calls
# may go down to this percent below the cheapest open lot's trade price. A
# loss realized on assignment counts against the loss budget net of what the
# same rally adds to the lots still held.
wheel.ratio_call_max_below_entry_pct=5
# Delta ranges for new short options in each mode, in hundredths (20-30 =
# 0.20-0.30): the copilot's playbook and Home's New Income ideas both use
# them. Defensive mode sells no new puts, so it has no put range.
wheel.aggressive_put_delta_pct=20-30
wheel.neutral_put_delta_pct=10-20
wheel.aggressive_call_delta_pct=25-30
wheel.neutral_call_delta_pct=20-30
wheel.defensive_call_delta_pct=30-40

# Home page rules.
# Margin estimate for /ES and /NQ futures in the stress test (idea sizing
# and the margin-call alert), as a percent of the futures' notional — Schwab doesn't report
# futures margin. 11 matched thinkorswim's figure for a book of long futures
# with short options against them (Oct 2026); recheck it against
# thinkorswim's Margin Req when the futures book changes.
home.futures_margin_pct=11
# A short option that has kept this percent of its premium is a "take
# profit" candidate.
home.take_profit_pct=75
# New-income ideas: /ES and /NQ short options expiring within idea_max_dte
# days, picked by the options-wheel rules above (the mode from leverage, its
# delta range, call cover) and ranked as if the market moves idea_crash_pct
# against them (below).
home.idea_max_dte=7
# New-income ideas assume the market can move this percent against a short
# at once — down for puts, up for calls — with volatility rising as in
# home.stress_iv_rise. Each idea is ranked by its credit over what that move
# would cost (buyback loss + margin after it), and sized so the account's
# margin cushion stays above zero after the move.
home.idea_crash_pct=5
# A new-income idea that expires after a major scheduled event (CPI, jobs
# report, PCE, an FOMC decision) is judged against this larger move instead.
home.event_crash_pct=8

# Market events (Home's Upcoming events card).
# FOMC rate decisions — the second day of each meeting, statement at 2:00 PM
# ET. From the Fed's calendar (federalreserve.gov/monetarypolicy/
# fomccalendars.htm), which has no API; 2027's dates were tentative when
# entered (Oct 2026). Add the next year's when the Fed publishes them.
events.fomc_dates=2026-10-28,2026-12-09,2027-01-27,2027-03-17,2027-04-28,2027-06-09,2027-07-28,2027-09-15,2027-10-27,2027-12-08
# Stress test (idea sizing and the margin-call alert): implied volatility
# points added to every option at a 10% market drop (scaled with the drop: 10 at -5%, 40 at -20%;
# rallies leave volatility unchanged). 20 is on the cautious side — VIX
# has roughly doubled from the high teens in past 10% selloffs.
home.stress_iv_rise=20
