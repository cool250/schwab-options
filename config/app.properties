# Application-level choices — one setting per line, `key=value`; `#` starts a
# comment. Read once at startup by utils/app_config.py, which lists every
# allowed key with its type and default and rejects unknown keys or bad
# values (a typo fails the app's start, it's never silently ignored).
# Restart the backend after editing. Set APP_PROPERTIES to use another file.

# Merge legs that form a ratio spread (buy 1 / sell 2+ at another strike,
# same expiration, opened together) into one row: Positions' futures-option
# tables, the copilot's trade history, and the default of the Transactions
# page's "Ignore Grouping" checkbox (still changeable per search there).
trades.group_ratio_spreads=false

# Which option rows the Transactions page shows when opened: realized
# (closed legs), unrealized (still-open legs), or both.
transactions.default_view=both

# How far back Positions reconstructs open futures / futures-option
# positions from transaction history (Schwab's positions endpoint doesn't
# return them). Longer catches older open positions but is slower.
positions.open_lookback_days=30

# Extra history fetched around a requested date range (Transactions,
# Reports, the copilot), so a trade whose open falls before the range — or
# whose close is recorded just after it — still gets matched. Options look
# back option_lookback_days and forward option_lookforward_days; equities
# and outright futures, which sit open longer, look back
# equity_lookback_days. Longer catches older opens but is slower. A request
# is capped at a year (Schwab's limit): on a long range the option padding
# shrinks to fit, while the equity lookback is fetched a year at a time
# (one extra request per year of lookback).
transactions.option_lookback_days=30
transactions.option_lookforward_days=5
transactions.equity_lookback_days=365

# Default date range, in days back from today, for the copilot's trade
# history tools when the question doesn't name one.
copilot.history_days=90
