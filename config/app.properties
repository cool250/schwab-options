# Application-level choices — one setting per line, `key=value`; `#` starts a
# comment. Read once at startup by utils/app_config.py, which lists every
# allowed key with its type and default and rejects unknown keys or bad
# values (a typo fails the app's start, it's never silently ignored).
# Restart the backend after editing. Set APP_PROPERTIES to use another file.

# Merge legs that form a ratio spread (buy 1 / sell 2+ at another strike,
# same expiration, opened together) into one row: Positions' futures-option
# tables, the copilot's trade history, and the default of the Transactions
# page's "Ignore Grouping" checkbox (still changeable per search there).
trades.group_ratio_spreads=false

# Which rows the Transactions page shows when opened: realized (closed),
# unrealized (still open), or both. Options tab: the Realized / Unrealized
# boxes. Equity & futures tab: "realized" ticks Realized Gains Only; "both"
# or "unrealized" leaves it unticked, showing closed and open lots.
transactions.default_view=both

# How far back Positions reconstructs open futures / futures-option
# positions from transaction history (Schwab's positions endpoint doesn't
# return them). Longer catches older open positions but is slower.
positions.open_lookback_days=30

# Extra history fetched around a requested date range (Transactions,
# Reports, the copilot), so a trade whose open falls before the range — or
# whose close is recorded just after it — still gets matched. Options look
# back option_lookback_days and forward option_lookforward_days; equities
# and outright futures, which sit open longer, look back
# equity_lookback_days. Longer catches older opens but is slower. A request
# is capped at a year (Schwab's limit): on a long range the option padding
# shrinks to fit, while the equity lookback is fetched a year at a time
# (one extra request per year of lookback).
transactions.option_lookback_days=30
transactions.option_lookforward_days=5
transactions.equity_lookback_days=365

# Default date range, in days back from today, for the copilot's trade
# history tools when the question doesn't name one.
copilot.history_days=90

# Home page rules.
# Margin estimate for /ES and /NQ futures (and for sizing new futures-option
# trades), as a percent of the futures' notional — Schwab doesn't report
# futures margin. 11 matched thinkorswim's figure for a book of long futures
# with short options against them (Oct 2026); recheck it against
# thinkorswim's Margin Req when the futures book changes.
home.futures_margin_pct=11
# thinkorswim's Available Funds For Trading (Account Info), in whole dollars:
# the margin cushion with futures included, which Schwab's API can't give
# (its figure is the securities account's only). When set, Home's margin
# cushion and "Room for" sizing start from it; 0 = use Schwab's figure.
# Update it when it changes — Home shows it as entered, not live.
home.available_funds=807545
# A short option that has kept this percent of its premium is a "take
# profit" candidate.
home.take_profit_pct=75
# Shorts expiring within this many days are listed; one within at_risk_pct
# of its strike (or past it) is flagged at risk.
home.expiring_days=7
home.at_risk_pct=2
# A ticker whose exposure is above this percent of net liquidation value
# is flagged.
home.concentration_pct=25
# New-income ideas: /ES and /NQ short options expiring within idea_max_dte
# days, with an absolute delta between these (in hundredths: 10 = 0.10).
home.idea_max_dte=7
home.idea_min_delta_pct=10
home.idea_max_delta_pct=30
# Margin cushion stress test: implied volatility points added to every
# option at a 10% market drop (scaled with the drop: 10 at -5%, 40 at -20%;
# rallies leave volatility unchanged). 20 is on the cautious side — VIX
# has roughly doubled from the high teens in past 10% selloffs.
home.stress_iv_rise=20
