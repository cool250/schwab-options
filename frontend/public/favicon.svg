<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- InduTrades app icon: the options "wheel" (a circular arrow — sell a
       put, get assigned, sell a call, repeat) around rising candles. Also
       the mark in indutrades_logo.svg; keep the two in sync. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Wheel: a 320° clockwise arc with an arrowhead closing the gap at the top -->
  <path d="M39.2 12.3A21 21 0 1 1 24.8 12.3" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M30.6 10.2L23.2 7.6L25.9 16.9Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Rising candles, the last one in gold -->
  <g stroke-linecap="round">
    <line x1="24.5" y1="34" x2="24.5" y2="46" stroke="#ccfbf1" stroke-width="1.6"/>
    <rect x="22" y="37" width="5" height="7" rx="1" fill="#ccfbf1"/>
    <line x1="32" y1="27" x2="32" y2="43" stroke="#fff" stroke-width="1.6"/>
    <rect x="29.5" y="30" width="5" height="10" rx="1" fill="#fff"/>
    <line x1="39.5" y1="19" x2="39.5" y2="38" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="37" y="22" width="5" height="13" rx="1" fill="#fbbf24"/>
  </g>
</svg>
