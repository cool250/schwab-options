# Fly.io config — see the "Deploying to Fly.io" section of README.md.
# `app` must be globally unique on Fly: change it (or let `fly launch`
# rewrite it) before the first deploy.
app = "options-wheel"
primary_region = "iad" # US East — close to Schwab/Tastytrade's servers

[build]
  dockerfile = "Dockerfile"

# Non-secret config. Credentials go in `fly secrets set` (README).
[env]
  PORT = "8080"
  # The Schwab token file lives on the persistent volume mounted below, so
  # it survives restarts and redeploys (broker/schwab/auth/token_provider.py).
  TOKEN_FILE = "/data/token.json"
  # Mirror app logs to stdout so `fly logs` shows them (api/app.py).
  LOG_TO_STDOUT = "true"
  CHAIN_PROVIDER = "tastytrade"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when nothing is connected and start it on the next
  # request — a single-user app is idle most of the day, so this cuts the
  # bill to only the hours it's actually used (first load after idle takes
  # a few seconds). Fly's proxy counts open WebSockets as connections, so a
  # live chain stream keeps the machine up.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

# One small volume for token.json. A volume attaches to exactly one machine,
# which is also why this app runs as a single machine (deploy with --ha=false).
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
